<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分割ファイル ダウンロード</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;line-height:1.6}
h1{font-size:1.6rem}.box{border:1px solid #ccc;border-radius:10px;padding:16px;margin:16px 0}
input,button{font:inherit}input{padding:8px;width:140px}button{padding:9px 18px;cursor:pointer}
progress{width:100%;height:22px}pre{background:#111;color:#eee;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:320px;overflow:auto}
.ok{color:#087f23}.err{color:#b00020}
</style>
</head>
<body>
<h1>分割ファイル ダウンロード</h1>
<div class="box">
<h2>ダウンロード番号</h2>
<p>番号を入力してください。例：<code>1</code> → <code>data1/</code></p>
<input id="downloadNumber" type="number" min="1" step="1" placeholder="番号">
<button id="run">ダウンロード開始</button>
<div id="info"></div>
<progress id="progress" value="0" max="1"></progress>
</div>
<div class="box"><h2>配置</h2><pre>index.html
data1/
  manifest.json
  part1.bin
  part2.bin
  ...
data2/
  manifest.json
  part1.bin
  ...</pre></div>
<div class="box"><h2>ログ</h2><pre id="log"></pre></div>
<script>
"use strict";
const $=id=>document.getElementById(id),logEl=$("log"),infoEl=$("info"),progressEl=$("progress");
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function log(msg,type="info"){const line="["+new Date().toLocaleTimeString()+"] "+msg;console.log(line);logEl.textContent+=line+"\n";logEl.scrollTop=logEl.scrollHeight;if(type==="error")infoEl.innerHTML='<span class="err">'+escapeHtml(msg)+'</span>';}
function setProgress(v){progressEl.value=Math.max(0,Math.min(1,v));}
function isSafePositiveInteger(v){return typeof v==="number"&&isFinite(v)&&Math.floor(v)===v&&v>0&&v<=9007199254740991;}
async function sha256(buffer){const hash=await crypto.subtle.digest("SHA-256",buffer);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function safeFilename(name){return String(name||"download.bin").replace(/[\\/:*?"<>|]/g,"_").replace(/^\.+$/,"download.bin")||"download.bin";}
async function getManifest(url){const r=await fetch(url,{cache:"no-store"});if(r.status===404)throw new Error("ダウンロードファイルが存在しません");if(!r.ok)throw new Error("manifest.json の取得に失敗しました (HTTP "+r.status+")");try{return await r.json();}catch(e){throw new Error("manifest.json が正しいJSONではありません");}}
$("run").addEventListener("click",async()=>{
logEl.textContent="";infoEl.textContent="";setProgress(0);
const raw=$("downloadNumber").value.trim();
if(!/^[1-9][0-9]*$/.test(raw)){log("ダウンロード番号を入力してください。","error");return;}
const number=Number(raw);if(!isSafePositiveInteger(number)){log("ダウンロード番号が大きすぎます。","error");return;}
const dataDir="data"+number+"/",manifestUrl=dataDir+"manifest.json";
log("ダウンロード番号: "+number);log("参照フォルダ: "+dataDir);log("manifest取得: "+manifestUrl);
try{
const manifest=await getManifest(manifestUrl);
if(manifest.format!=="split-download-v1")throw new Error("対応していないmanifest形式です。");
if(!isSafePositiveInteger(manifest.partCount))throw new Error("partCountが不正です。");
if(!isSafePositiveInteger(manifest.totalSize))throw new Error("totalSizeが不正です。");
if(!Array.isArray(manifest.parts)||manifest.parts.length!==manifest.partCount)throw new Error("partsの数がpartCountと一致しません。");
log("元ファイル: "+manifest.originalName);log("元サイズ: "+manifest.totalSize.toLocaleString()+" bytes");log("パーツ数: "+manifest.partCount);
const buffers=[];let total=0;
for(let i=0;i<manifest.parts.length;i++){
const part=manifest.parts[i],expected="part"+(i+1)+".bin";
if(part.name!==expected)throw new Error("パーツ名が不正です: "+part.name+"（"+expected+" が必要）");
const url=dataDir+encodeURIComponent(part.name);log("取得中 "+(i+1)+"/"+manifest.partCount+": "+url);
const r=await fetch(url,{cache:"no-store"});if(r.status===404)throw new Error(part.name+" が存在しません");if(!r.ok)throw new Error(part.name+" の取得に失敗しました (HTTP "+r.status+")");
const buf=await r.arrayBuffer();if(buf.byteLength!==part.size)throw new Error(part.name+": サイズ不一致 ("+buf.byteLength+" != "+part.size+")");
if(part.sha256){log(part.name+": SHA-256検証中");const hash=await sha256(buf);if(hash.toLowerCase()!==String(part.sha256).toLowerCase())throw new Error(part.name+": SHA-256不一致");log(part.name+": SHA-256 OK");}
buffers.push(buf);total+=buf.byteLength;setProgress((i+1)/manifest.partCount);log(part.name+": OK ("+buf.byteLength.toLocaleString()+" bytes)");
}
if(total!==manifest.totalSize)throw new Error("結合前の合計サイズが不一致です ("+total+" != "+manifest.totalSize+")");
log("全パーツの取得・検証完了");log("ファイルを結合中...");
const blob=new Blob(buffers,{type:manifest.mimeType||"application/octet-stream"});if(blob.size!==manifest.totalSize)throw new Error("結合後サイズが不一致です ("+blob.size+" != "+manifest.totalSize+")");
if(manifest.wholeSha256){log("完成ファイルのSHA-256検証中...");const h=await sha256(await blob.arrayBuffer());if(h.toLowerCase()!==String(manifest.wholeSha256).toLowerCase())throw new Error("完成ファイルのSHA-256が不一致です。");log("完成ファイルSHA-256: OK");}
const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=safeFilename(manifest.originalName);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);setProgress(1);log("ダウンロード開始: "+a.download);log("完成サイズ: "+blob.size.toLocaleString()+" bytes");infoEl.innerHTML='<span class="ok">ダウンロードを開始しました。</span>';
}catch(e){console.error(e);const msg=e&&e.message?e.message:String(e);log(msg==="ダウンロードファイルが存在しません"?msg:"エラー: "+msg,"error");setProgress(0);}
});
</script>
</body>
</html>
