<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分割ファイル ダウンロード</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;line-height:1.6}
h1{font-size:1.6rem}.box{border:1px solid #ccc;border-radius:10px;padding:16px;margin:16px 0}
button{font:inherit;padding:10px 18px;cursor:pointer}
progress{width:100%;height:22px}pre{background:#111;color:#eee;padding:12px;border-radius:8px;white-space:pre-wrap;max-height:320px;overflow:auto}
.small{color:#666;font-size:.9em}.ok{color:#087f23}.err{color:#b00020}
</style>
</head>
<body>
<h1>分割ファイル ダウンロード</h1>

<div class="box">
  <p>同じページの <code>data1/manifest.json</code> を読み込み、<code>part1.bin</code> → <code>part2.bin</code> → … の順番で結合します。</p>
  <button id="run">ダウンロード開始</button>
  <div id="info"></div>
  <progress id="progress" value="0" max="1"></progress>
</div>

<div class="box">
  <h2>GitHub Pagesの配置</h2>
  <pre>index.html
data1/
  manifest.json
  part1.bin
  part2.bin
  part3.bin
  ...</pre>
</div>

<div class="box">
  <h2>ログ</h2>
  <pre id="log"></pre>
</div>

<script>
"use strict";

const DATA_DIR = "data/";
const MANIFEST_URL = DATA_DIR + "manifest.json";
const $ = id => document.getElementById(id);
const logEl = $("log");
const infoEl = $("info");
const progressEl = $("progress");

function log(msg,type="info"){
  const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
  console.log(line);
  logEl.textContent += line + "\\n";
  logEl.scrollTop = logEl.scrollHeight;
  if(type === "error") infoEl.innerHTML = `<span class="err">${escapeHtml(msg)}</span>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function setProgress(v){ progressEl.value = Math.max(0,Math.min(1,v)); }

async function sha256(buffer){
  const hash = await crypto.subtle.digest("SHA-256",buffer);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function safeFilename(name){
  const s = String(name || "download.bin");
  // ブラウザ側でパスとして解釈されないようファイル名部分だけに限定
  return s.replace(/[\/\\:*?"<>|]/g,"_").replace(/^\.+$/,"download.bin") || "download.bin";
}

$("run").addEventListener("click", async ()=>{
  logEl.textContent = "";
  setProgress(0);
  try{
    log(`manifest取得: ${MANIFEST_URL}`);
    const mr = await fetch(MANIFEST_URL,{cache:"no-store"});
    if(!mr.ok) throw new Error(`manifest.json HTTP ${mr.status}`);
    const manifest = await mr.json();

    if(manifest.format !== "split-download-v1")
      throw new Error("対応していないmanifest形式です。");
    if(!Number.isInteger(manifest.partCount) || manifest.partCount < 1)
      throw new Error("partCountが不正です。");
    if(!Array.isSafeInteger(manifest.totalSize) || manifest.totalSize < 1)
      throw new Error("totalSizeが不正です。");
    if(!Array.isArray(manifest.parts) || manifest.parts.length !== manifest.partCount)
      throw new Error("partsの数がpartCountと一致しません。");

    log(`元ファイル: ${manifest.originalName}`);
    log(`元サイズ: ${manifest.totalSize.toLocaleString()} bytes`);
    log(`パーツ数: ${manifest.partCount}`);

    const buffers = [];
    let total = 0;

    for(let i=0;i<manifest.parts.length;i++){
      const p = manifest.parts[i];

      if(p.name !== `part${i+1}.bin`)
        throw new Error(`パーツ名が不正です: ${p.name}`);

      const url = DATA_DIR + encodeURIComponent(p.name);
      log(`取得中 ${i+1}/${manifest.partCount}: ${url}`);

      const r = await fetch(url,{cache:"no-store"});
      if(!r.ok) throw new Error(`${p.name} HTTP ${r.status}`);

      const buf = await r.arrayBuffer();

      if(buf.byteLength !== p.size)
        throw new Error(`${p.name}: サイズ不一致 (${buf.byteLength} != ${p.size})`);

      if(p.sha256){
        log(`${p.name}: SHA-256検証中`);
        const hash = await sha256(buf);
        if(hash.toLowerCase() !== String(p.sha256).toLowerCase())
          throw new Error(`${p.name}: SHA-256不一致`);
      }

      buffers.push(buf);
      total += buf.byteLength;
      setProgress((i+1)/manifest.partCount);
      log(`${p.name}: OK (${buf.byteLength.toLocaleString()} bytes)`);
    }

    if(total !== manifest.totalSize)
      throw new Error(`結合前の合計サイズが不一致です (${total} != ${manifest.totalSize})`);

    log("全パーツ検証完了。結合中...");
    const blob = new Blob(buffers,{type:manifest.mimeType || "application/octet-stream"});

    if(blob.size !== manifest.totalSize)
      throw new Error(`結合後サイズが不一致です (${blob.size} != ${manifest.totalSize})`);

    // 最終ファイル全体も検証（manifestにwholeSha256がある場合）
    if(manifest.wholeSha256){
      log("完成ファイルのSHA-256検証中...");
      const wholeHash = await sha256(await blob.arrayBuffer());
      if(wholeHash.toLowerCase() !== String(manifest.wholeSha256).toLowerCase())
        throw new Error("完成ファイルのSHA-256が不一致です。");
      log("完成ファイルSHA-256: OK");
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = safeFilename(manifest.originalName);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);

    log(`ダウンロード開始: ${a.download}`);
    log(`完成サイズ: ${blob.size.toLocaleString()} bytes`);
    infoEl.innerHTML = `<span class="ok">完了：ファイルを結合してダウンロードしました。</span>`;
    setProgress(1);
  }catch(e){
    console.error(e);
    log(`エラー: ${e?.stack || e}`,"error");
  }
});
</script>
</body>
</html>
